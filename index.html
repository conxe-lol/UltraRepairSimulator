<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ULTRA REPAIR SIMULATOR</title>
<style>
:root{color-scheme:dark;--bg:#14161a;--desk:#241f1a;--mat:#2c4640;--steel:#aeb6bf;--amber:#e8b04a;--red:#e5594f;--ok:#6fcf97;--ink:#e9e6df;--mute:#8d939b;--panel:#1d2025;--line:#363b43;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 Bahnschrift,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;gap:14px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px}
#hud b{color:var(--amber)}
#task{flex:1 1 100%;color:var(--mute)}
#stage{flex:1;min-height:0;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;background:radial-gradient(ellipse at 50% 30%,#3a2f25 0,var(--desk) 70%)}
#mat{height:94%;margin:0 4px;border-radius:18px;background:linear-gradient(160deg,#35564e,var(--mat));box-shadow:inset 0 0 40px #0008,0 10px 30px #000a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#phone{height:96%;transition:transform .25s;filter:drop-shadow(0 14px 12px #000b)}
#side,#right{display:flex;flex-direction:column;gap:8px;padding:6px;align-items:stretch;font-size:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-height:44px}
.chip.sel{border-color:var(--amber);color:var(--amber)}
#mon{background:#0c0e11;border:3px solid #444a52;border-radius:8px;height:84px;display:flex;align-items:center;justify-content:center;color:#7fd0ff;font-size:12px;text-align:center;box-shadow:0 0 18px #3aa8ff44}
#bar{display:flex;gap:6px;padding:8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.btn{flex:0 0 auto;min-height:46px;min-width:64px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#272b32;color:var(--ink);font:inherit}
.btn.sel{background:var(--amber);color:#201808;border-color:var(--amber)}
.btn.go{background:#2d4a3a;border-color:var(--ok)}
#msg{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;border:1px solid var(--amber);padding:8px 14px;border-radius:10px;max-width:90%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px)}
#win{width:min(560px,100%);max-height:92%;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
#wt{display:flex;align-items:center;gap:6px;padding:6px;background:#15171b;border-bottom:1px solid var(--line)}
#wt .btn{min-height:40px}
#wt .x{margin-left:auto;background:#4a2523}
#wb{padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}
#wb p{margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--red)}.mute{color:var(--mute)}
pre{white-space:pre-wrap;margin:6px 0;font:12px/1.4 ui-monospace,Consolas,monospace;color:#9fd8a8;background:#0c0e11;padding:8px;border-radius:8px}
@keyframes sp{to{transform:rotate(720deg)}}
.spin{animation:sp .65s linear;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:520px){#stage{grid-template-columns:78px 1fr 78px}}
</style></head><body>
<div id="app">
 <div id="hud"><span>День <b id="hd">1</b></span><span>Баланс <b id="hm">0</b> $</span><span>Репутация <b id="hr">0</b></span><span id="task"></span></div>
 <div id="stage">
  <div id="side"></div>
  <div id="mat"><svg id="phone" viewBox="0 0 200 400"></svg></div>
  <div id="right"><div id="mon" data-act="pc">Монитор<br>нажми, чтобы открыть</div><div class="chip" data-act="flip">Перевернуть</div><div class="chip" data-act="zin">Приблизить</div><div class="chip" data-act="zout">Отдалить</div></div>
 </div>
 <div id="bar"></div>
</div>
<div id="msg"></div>
<div id="ov"><div id="win"><div id="wt"></div><div id="wb"></div></div></div>
<script>
const $=s=>document.querySelector(s),K='ultra-repair-save-v1';
const TOOLS={p2:'Отвёртка P2',ph:'Отвёртка PH0',suc:'Присоска',tw:'Пинцет'};
const PARTS={bat_o:{n:'Аккумулятор оригинал',p:30,q:1,t:'bat'},bat_c:{n:'Аккумулятор дешёвый',p:14,q:.6,t:'bat'},prt_o:{n:'Плата разъёма оригинал',p:22,q:1,t:'prt'},prt_c:{n:'Плата разъёма дешёвая',p:10,q:.6,t:'prt'}};
const CL=[['Игорь','Телефон вчера упал, с утра не заряжается.'],['Алина','Садится и вырубается на 30 процентах.'],['Максим','Кабель вставляю — тишина.']];
let S=null,tool=null,flip=false,zoom=1,selPart=null,log=[];
const R=a=>a[Math.floor(Math.random()*a.length)];
function msg(t){const m=$('#msg');m.textContent=t;m.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.opacity=0,2600);log.push('День '+S.day+': '+t);if(log.length>40)log.shift()}
function newOrder(){const f=R(['bat','prt']),c=R(CL);
 S.order={name:c[0],say:c[1],budget:95,fault:f};
 S.cover='closed';S.conn=true;S.cable=false;S.dmg=0;S.def=false;S.tested=null;
 S.bat={inst:true,bad:f==='bat'};S.prt={inst:true,bad:f==='prt'};
 S.screws=[{id:1,t:'p2',x:70,y:380,s:'in'},{id:2,t:'p2',x:130,y:380,s:'in'},{id:3,t:'ph',x:96,y:112,s:'in'},{id:4,t:'ph',x:124,y:112,s:'in'}];
 S.tray={p2:0,ph:0};flip=false;save()}
function newGame(){S={day:1,money:150,rep:50,inv:{}};newOrder();ui()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){msg('Сохранение недоступно в этом браузере: прогресс не будет сохранён')}}
function load(){try{const j=localStorage.getItem(K);if(j){S=JSON.parse(j);return true}}catch(e){}return false}
const sc=(t)=>S.screws.filter(x=>x.t===t);
const allOut=t=>sc(t).every(x=>x.s==='out');
function phoneSVG(){
 let h='<defs><linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#3d434c"/><stop offset="1" stop-color="#22262c"/></linearGradient></defs>';
 h+='<rect x="8" y="8" width="184" height="384" rx="30" fill="#14171b" stroke="#6b737e" stroke-width="3"/>';
 if(flip){
  const lit=S.tested&&S.tested.boot;
  h+='<rect x="16" y="16" width="168" height="368" rx="24" fill="'+(lit?'#2a6fa8':'#05070a')+'"/><rect x="76" y="24" width="48" height="8" rx="4" fill="#000"/>';
  h+='<text x="100" y="210" fill="#9ab" font-size="11" text-anchor="middle">'+(lit?'Система загружена':'Экран выключен')+'</text>';
 }else{
  if(S.cover==='closed'){
   h+='<rect x="14" y="14" width="172" height="372" rx="26" fill="url(#bd)"/><rect x="22" y="22" width="58" height="58" rx="16" fill="#171a1f" stroke="#59616b"/><circle cx="40" cy="42" r="11" fill="#07090c" stroke="#6b737e"/><circle cx="62" cy="42" r="11" fill="#07090c" stroke="#6b737e"/><circle cx="51" cy="64" r="8" fill="#07090c" stroke="#6b737e"/><circle cx="100" cy="210" r="16" fill="none" stroke="#5b636d" stroke-width="2"/><rect x="14" y="14" width="172" height="372" rx="26" fill="transparent" data-act="cover"/>';
  }else{
   h+='<rect x="16" y="16" width="168" height="368" rx="24" fill="#1b2a27"/>';
   h+='<rect x="26" y="30" width="60" height="44" rx="4" fill="#2d3b37" stroke="#4a5e58"/><rect x="34" y="38" width="22" height="16" fill="#101615"/><rect x="62" y="40" width="16" height="26" fill="#0f1413"/><rect x="120" y="36" width="50" height="32" rx="3" fill="#3a4a45"/>';
   // battery slot
   h+=S.bat.inst?'<g data-act="bat"><rect x="30" y="130" width="140" height="170" rx="8" fill="'+(S.bat.bad?'#6a5a3a':'#8a9097')+'" stroke="#c9ced4"/><text x="100" y="205" fill="#222" font-size="11" text-anchor="middle">Li-Po 3.85V</text><text x="100" y="222" fill="#222" font-size="10" text-anchor="middle">'+(S.bat.bad?'корпус вздут':'в норме')+'</text></g>':'<rect x="30" y="130" width="140" height="170" rx="8" fill="none" stroke="#5a6b66" stroke-dasharray="5 4"/><text x="100" y="215" fill="#6e827b" font-size="10" text-anchor="middle">пустой отсек АКБ</text>';
   // port board
   h+=S.prt.inst?'<g data-act="prt"><rect x="55" y="316" width="90" height="44" rx="5" fill="#a8742a"/><rect x="82" y="338" width="36" height="14" rx="3" fill="#bfc5cc" stroke="#444"/><circle cx="64" cy="324" r="3" fill="#ddd"/><circle cx="136" cy="324" r="3" fill="#ddd"/></g>':'<rect x="55" y="316" width="90" height="44" rx="5" fill="none" stroke="#5a6b66" stroke-dasharray="5 4"/><text x="100" y="342" fill="#6e827b" font-size="9" text-anchor="middle">пусто</text>';
   // connector + bracket
   h+='<g data-act="conn"><rect x="92" y="96" width="32" height="12" rx="2" fill="'+(S.conn?'#d8b03c':'#555')+'" stroke="#222"/>'+(S.conn?'<line x1="108" y1="108" x2="108" y2="130" stroke="#d8b03c" stroke-width="3"/>':'<line x1="108" y1="108" x2="116" y2="122" stroke="#777" stroke-width="2" stroke-dasharray="3 2"/>')+'</g>';
   if(!allOut('ph'))h+='<rect x="84" y="102" width="52" height="20" rx="4" fill="#9aa0a8" stroke="#555" opacity=".95"/>';
  }
  S.screws.forEach(s=>{if(S.cover==='closed'&&s.t==='ph')return;
   h+='<g data-screw="'+s.id+'"><circle cx="'+s.x+'" cy="'+s.y+'" r="15" fill="transparent"/><g class="sw" id="sw'+s.id+'"><circle cx="'+s.x+'" cy="'+s.y+'" r="'+(s.t==='p2'?4.5:3.6)+'" fill="'+(s.s==='out'?'#050607':s.s==='stripped'?'#7a5a4a':'#c4c9d0')+'" stroke="#222"/>'+(s.s==='out'?'':'<path d="M'+(s.x-3)+' '+s.y+'h6M'+s.x+' '+(s.y-3)+'v6" stroke="#333" stroke-width="1.2"/>')+'</g></g>'});
 }
 $('#phone').innerHTML=h;$('#phone').style.transform='scale('+zoom+')';
}
function ui(){
 $('#hd').textContent=S.day;$('#hm').textContent=S.money;$('#hr').textContent=S.rep;
 $('#task').textContent='Заказ: '+S.order.name+' — «'+S.order.say+'» Бюджет '+S.order.budget+' $';
 phoneSVG();
 $('#side').innerHTML='<div class="chip">Лоток<br>P2: '+S.tray.p2+'<br>PH0: '+S.tray.ph+'</div>'+Object.keys(S.inv).filter(k=>S.inv[k]>0).map(k=>'<div class="chip '+(selPart===k?'sel':'')+'" data-part="'+k+'">'+PARTS[k].n+' ×'+S.inv[k]+'</div>').join('');
 $('#bar').innerHTML=Object.keys(TOOLS).map(k=>'<button class="btn '+(tool===k?'sel':'')+'" data-tool="'+k+'">'+TOOLS[k]+'</button>').join('')+(S.cover==='open'?'<button class="btn" data-act="close">Закрыть крышку</button>':'')+'<button class="btn" data-act="look">Осмотр</button><button class="btn go" data-act="test">Проверка</button><button class="btn" data-act="saveb">Сохранить</button>';
}
// screws: hold with the right driver
let hold=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-screw]');if(!g)return;
 const s=S.screws.find(x=>x.id==g.dataset.screw);if(!tool){msg('Сначала выбери инструмент внизу');return}
 const el=g.querySelector('.sw');el.classList.add('spin');
 hold=setTimeout(()=>{el.classList.remove('spin');screwAct(s);hold=null},650)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,()=>{if(hold){clearTimeout(hold);hold=null;document.querySelectorAll('.spin').forEach(x=>x.classList.remove('spin'))}}));
function screwAct(s){
 if(s.s==='stripped'){if(tool==='tw'){s.s='out';S.tray[s.t]++;msg('Сорванный винт выдернут пинцетом')}else msg('Шлиц сорван — вытащи пинцетом');return save(),ui()}
 if(tool==='tw'||tool==='suc'){msg('Этим инструментом винт не открутить');return}
 if(s.s==='in'){
  if(tool!==s.t){if(Math.random()<.5){s.s='stripped';msg('Не тот шлиц! Винт сорван')}else msg('Отвёртка не подходит к этому винту — повезло, шлиц цел');}
  else{s.s='out';S.tray[s.t]++;msg('Винт '+(s.t==='p2'?'P2':'PH0')+' в лотке')}
 }else{
  if(tool!==s.t)return msg('Нужна другая отвёртка');
  if(S.tray[s.t]<1)return msg('В лотке нет винтов этого типа — потеряны?');
  s.s='in';S.tray[s.t]--;msg('Винт закручен')}
 save();ui()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tool]');if(t){tool=tool===t.dataset.tool?null:t.dataset.tool;return ui()}
 const p=e.target.closest('[data-part]');if(p){selPart=selPart===p.dataset.part?null:p.dataset.part;return ui()}
 const a=e.target.closest('[data-act]');if(!a||e.target.closest('#ov'))return;act(a.dataset.act)});
function act(a){
 if(a==='flip'){flip=!flip}
 else if(a==='zin')zoom=Math.min(1.5,zoom+.15);else if(a==='zout')zoom=Math.max(.7,zoom-.15);
 else if(a==='pc')return openPC('desk');
 else if(a==='saveb'){save();msg('Игра сохранена')}
 else if(a==='cover'){
  if(tool!=='suc')return msg('Крышку открывает присоска, выбери её');
  if(!allOut('p2'))return msg('Крышку держат винты P2 снизу');
  S.cover='open';msg('Крышка снята. Внутри: аккумулятор, разъём, плата зарядки')}
 else if(a==='close'){S.cover='closed';msg('Крышка закрыта')}
 else if(a==='conn'){
  if(tool!=='tw')return msg('Разъём аккумулятора снимают пинцетом');
  if(!allOut('ph'))return msg('Скоба с винтами PH0 закрывает разъём');
  S.conn=!S.conn;msg(S.conn?'Аккумулятор подключён':'Аккумулятор отключён')}
 else if(a==='bat'||a==='prt'){
  const c=S[a];
  if(tool!=='tw'&&!c.inst)return;
  if(c.inst){
   if(tool!=='tw')return msg('Деталь снимают пинцетом');
   if(S.conn){if(Math.random()<.5){S.dmg++;S.money-=20;msg('Короткое замыкание! Сначала отключи аккумулятор. Плата повреждена (−20 $)')}else msg('Отключи аккумулятор, иначе будет короткое замыкание');return save(),ui()}
   c.inst=false;msg('Деталь снята')}
 }
 save();ui()}
// install by clicking empty slot with selected part
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)return;
 // empty slots have no data-act, so handled via coordinates below
});
$('#phone').addEventListener('click',e=>{
 if(flip||S.cover!=='open'||!selPart)return;
 const pt=$('#phone').createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform($('#phone').getScreenCTM().inverse());
 const slot=q.y>300?'prt':(q.y>125&&q.y<305?'bat':null);if(!slot||S[slot].inst)return;
 const P=PARTS[selPart];if(P.t!==slot)return msg('Деталь не подходит к этому отсеку');
 if(S.conn&&slot==='bat'){} 
 S[slot]={inst:true,bad:Math.random()>P.q?true:false,fresh:true};S.inv[selPart]--;if(S.inv[selPart]<1)selPart=null;msg('Деталь установлена');save();ui()});
function look(){const o=S.order;
 let t='Корпус: мелкие царапины, следов вскрытия нет.';
 if(S.cover==='open'){t='Внутри: '+(S.bat.inst?(S.bat.bad?'аккумулятор слегка вздут.':'аккумулятор выглядит нормально.'):'аккумулятор снят.')+' '+(S.prt.inst?(S.prt.bad?'В разъёме зарядки окисление.':'Разъём чистый.'):'плата разъёма снята.')}
 else if(S.prt.bad)t+=' В порту зарядки видны тёмные следы.';
 msg(t)}
function openPC(tab){
 const tabs={order:'Заказ',diag:'Диагностика',shop:'Запчасти',log:'Журнал'};
 $('#ov').style.display='flex';
 $('#wt').innerHTML=Object.keys(tabs).map(k=>'<button class="btn '+(k===tab?'sel':'')+'" data-tab="'+k+'">'+tabs[k]+'</button>').join('')+'<button class="btn x" data-close="1">Закрыть</button>';
 let h='';
 if(tab==='order'){const o=S.order;h='<p><b>'+o.name+'</b>: «'+o.say+'»</p><p class="mute">Описание клиента не всегда точно. Причину нужно найти диагностикой и осмотром.</p><p>Бюджет: <b>'+o.budget+' $</b></p><p>Устройство: RX-1 (собственная вымышленная модель)</p>'}
 if(tab==='diag'){h='<div class="row"><span>USB-кабель к телефону</span><button class="btn '+(S.cable?'sel':'')+'" data-d="cable">'+(S.cable?'Подключён':'Подключить')+'</button></div><div class="row"><span>Проверка USB</span><button class="btn" data-d="usb">Запустить</button></div><div class="row"><span>Проверка аккумулятора</span><button class="btn" data-d="batt">Запустить</button></div><pre id="out">Выбери проверку.</pre>'}
 if(tab==='shop'){h='<p class="mute">Баланс: '+S.money+' $. Доставка в этой версии мгновенная. Дешёвые детали иногда бракованные.</p>'+Object.keys(PARTS).map(k=>'<div class="row"><span>'+PARTS[k].n+'<br><span class="mute">совместима с RX-1 · '+PARTS[k].p+' $</span></span><button class="btn" data-buy="'+k+'">Купить</button></div>').join('')}
 if(tab==='log')h='<pre>'+(log.join('\n')||'Пока пусто')+'</pre>';
 $('#wb').innerHTML=h}
$('#ov').addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t)return openPC(t.dataset.tab);
 if(e.target.closest('[data-close]'))return $('#ov').style.display='none';
 const b=e.target.closest('[data-buy]');if(b){const P=PARTS[b.dataset.buy];if(S.money<P.p)return msg('Не хватает денег');S.money-=P.p;S.inv[b.dataset.buy]=(S.inv[b.dataset.buy]||0)+1;save();ui();return openPC('shop')}
 const d=e.target.closest('[data-d]');if(!d)return;
 if(d.dataset.d==='cable'){S.cable=!S.cable;save();return openPC('diag')}
 const out=$('#out');
 if(!S.cable){out.textContent='Кабель не подключён: связи с телефоном нет.';return}
 if(d.dataset.d==='usb'){out.textContent=!S.prt.inst?'Ошибка: разъём отсутствует.':S.prt.bad?'Устройство не опознано (код 43). Контакт нестабилен.':'RX-1 определён по USB 2.0, обмен данными стабилен.'}
 if(d.dataset.d==='batt'){out.textContent=!S.bat.inst?'Ошибка: аккумулятор не найден.':!S.conn?'Аккумулятор отключён от платы.':S.bat.bad?'Ёмкость 38%, напряжение 3.2 В, сильная просадка под нагрузкой.':'Ёмкость 96%, напряжение 3.85 В, просадки нет.'}});
function test(){
 if(S.cover!=='closed')return msg('Закрой крышку перед проверкой');
 const miss=S.screws.filter(s=>s.s!=='in').length;
 const r={batt:S.bat.inst&&S.conn&&!S.bat.bad,usb:S.prt.inst&&!S.prt.bad};
 r.boot=r.batt&&!S.soft;r.miss=miss;S.tested=r;
 const rows=[['Включение',r.boot,r.boot?'система загружена':!S.bat.inst||!S.conn?'нет питания: аккумулятор не подключён':S.soft&&r.batt?'циклическая перезагрузка: нужна прошивка':'аккумулятор не держит нагрузку'],['Аккумулятор',r.batt,r.batt?'ёмкость в норме':'не проходит'],['Зарядка USB',r.usb,r.usb?'зарядка идёт':'порт не работает'],['Крепёж',miss===0,miss===0?'все винты на месте':'не хватает винтов: '+miss]];

 if(c==='help')out(ios?'idevicerestore -l\nidevicerestore <файл>\nclear':'adb devices\nfastboot devices\nfastboot flash all <файл>\nadb sideload <файл>\nclear');
